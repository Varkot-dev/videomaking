name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# The suite is fully mocked — no LLM calls, no network, no rendering — so CI
# needs no API keys and costs nothing to run.
env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        # manimlib is imported by several test modules for its symbols. It pulls
        # in pycairo and pangocairo, which need these headers to build. No GL
        # context is ever created — nothing here renders.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libcairo2-dev libpango1.0-dev pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock pytest-cov hypothesis
          pip install -e .

      - name: Run tests
        # A bare pytest, matching what pyproject.toml declares. Reintroducing
        # --ignore flags here would recreate the local/CI divergence that
        # config comment exists to prevent.
        run: python -m pytest -q

  lint:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff
        # Non-blocking for now: the codebase predates linting and a hard failure
        # would only teach contributors to ignore this job. Tighten once the
        # existing findings are burned down.
        run: ruff check . --output-format=github || true

      - name: Fail on syntax errors
        # This half is blocking. Anything ruff classes as E9/F63/F7/F82 is a
        # genuine error — undefined names, broken syntax — not a style opinion.
        run: ruff check . --select=E9,F63,F7,F82

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan working tree for credentials
        # This repository is public, so a committed key is exposed permanently
        # even if a later commit deletes it. Catching one before it lands is the
        # only cheap moment.
        run: |
          set -o pipefail
          if git grep -nIE \
            'AIza[0-9A-Za-z_-]{35}|sk-ant-[0-9A-Za-z_-]{20,}|sk-proj-[0-9A-Za-z_-]{20,}|ghp_[0-9A-Za-z]{36}|AKIA[0-9A-Z]{16}|xoxb-[0-9A-Za-z-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' \
            -- . ':(exclude).github/workflows/ci.yml'; then
            echo "::error::Possible credential found in the working tree"
            exit 1
          fi
          echo "No credential patterns found."

      - name: Verify .env is not tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked — it must stay gitignored"
            exit 1
          fi
          echo ".env is not tracked."
