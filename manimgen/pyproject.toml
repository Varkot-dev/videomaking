# Build backend. Metadata, dependencies and package data live in setup.py (which
# reads requirements.txt). setuptools 64+ is needed for PEP 660 editable installs;
# this only affects the isolated build env, not the runtime setuptools<81 pin.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# Pytest configuration — the single source of truth for how the suite runs.
#
# GOAL: local == CI. The historically-documented local command used a curated
# `--ignore` trio (test_scene_generator.py / test_planner.py /
# test_pipeline_e2e.py). Those files are FULLY MOCKED (zero real LLM/network
# cost), so ignoring them only hid the local↔CI divergence — a regression in
# them passed locally but failed CI. This config makes a bare `pytest` (or
# `python3 -m pytest`) run the EXACT set CI runs: tests/, no ignores, strict
# markers. Do not reintroduce default `--ignore` flags here.
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "--strict-markers"
# A hung test (tests/test_llm.py spawns real sleeping subprocesses) is killed
# after this many seconds instead of holding a runner until the job timeout.
# Override per test with @pytest.mark.timeout(n).
timeout = 120
markers = [
    "unit: isolated function/utility/component tests (no I/O, no subprocess)",
    "integration: cross-module wiring with all LLM/subprocess seams mocked",
    "security: input-validation / traversal / XSS / auth-boundary tests",
]
