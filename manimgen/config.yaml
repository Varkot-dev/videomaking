# API keys — set via environment variables, not hardcoded here
anthropic_api_key: ""   # ANTHROPIC_API_KEY — only for llm_provider: anthropic
gemini_api_key: ""      # GEMINI_API_KEY — only for llm_provider: gemini

# Which LLM to use: "claude_cli" | "anthropic" | "gemini" | "ollama"
#   claude_cli — runs `claude -p` (Claude Code), billed to your Claude plan; no API key
#   anthropic  — Claude API, billed per token
#   gemini     — Gemini API, billed per token
#   ollama     — local model, free, lower quality
llm_provider: "claude_cli"

# Model selection — override here without touching code
llm:
  claude_cli_model: "sonnet"   # alias or full model ID, e.g. "opus" for the strongest model
  claude_cli_path: "claude"    # executable name or full path to Claude Code
  gemini_model: "gemini-2.5-flash"
  anthropic_model: "claude-sonnet-5-5"
  max_tokens: 16000       # Only used by Anthropic provider
  ollama_model: "llama3.1"
  ollama_base_url: "http://localhost:11434"

output:
  scenes_dir: manimgen/output/scenes
  videos_dir: manimgen/output/videos
  logs_dir: manimgen/output/logs
  audio_dir: manimgen/output/audio
  muxed_dir: manimgen/output/muxed
  exports_dir: manimgen/output/videos/exports
  plan_cache: manimgen/output/plan.json

rendering:
  quality: hd           # hd = 1080p | m = 480p | l = 720p
  resolution: "1920x1080"
  fps: 60
  max_retries: 3        # LLM retry calls per scene (increase for production)

# Codeguard Phase 3 — kwarg enforcement
# When MANIMGEN_KWARG_ENFORCE=1, provably-invalid constructor kwargs are stripped
# before render (Phase 2 shadow-mode data confirms safety). Default: off (shadow only).
# Enable after verifying zero false positives in a shadow log run.
#   export MANIMGEN_KWARG_ENFORCE=1
#
# Freeze-frame detection threshold (seconds). Cues with animation finishing this
# many seconds before narration ends are hard-blocked and routed to retry.
# Lower = stricter. Default: 2.5s (env: MANIMGEN_FREEZE_BLOCK_THRESHOLD).
#   export MANIMGEN_FREEZE_BLOCK_THRESHOLD=2.0

tts:
  # edge-tts is the ONLY implemented engine. renderer/tts.py does not read this
  # key at all — it calls edge-tts directly. ElevenLabs / OpenAI backends are a
  # possible future addition (UNIMPLEMENTED); until one lands, changing this
  # value has no effect on which engine runs.
  engine: edge-tts
  voice: en-US-AndrewMultilingualNeural
  enabled: true
  speed: "+5%"
