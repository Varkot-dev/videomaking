# API keys — set via environment variables, not hardcoded here
anthropic_api_key: ""   # ANTHROPIC_API_KEY — only for llm_provider: anthropic
gemini_api_key: ""      # GEMINI_API_KEY — only for llm_provider: gemini

# Which LLM to use: "claude_cli" | "anthropic" | "gemini" | "ollama"
#   claude_cli — runs `claude -p` (Claude Code), billed to your Claude plan; no API key
#   anthropic  — Claude API, billed per token
#   gemini     — Gemini API, billed per token
#   ollama     — local model, free, lower quality
llm_provider: "claude_cli"

# Model selection — override here without touching code
llm:
  claude_cli_model: "sonnet"   # alias or full model ID, e.g. "opus" for the strongest model
  claude_cli_path: "claude"    # executable name or full path to Claude Code
  # Per-role model routing. Every role uses the provider's default model (above)
  # unless listed here, so nothing is changed by default. Uncomment one line to
  # route that role elsewhere; values are an alias ("haiku", "sonnet", "opus") or
  # a full model ID and must be valid for the active llm_provider. An
  # MANIMGEN_MODEL_<ROLE> environment variable (for example
  # MANIMGEN_MODEL_DIRECTOR=opus) beats this block; an unknown role or an empty
  # value falls back to the default.
  #   researcher    research brief                     (planner/lesson_planner.py)
  #   planner       topic storyboard                   (planner/lesson_planner.py)
  #   planner_pdf   PDF storyboard                     (planner/lesson_planner.py)
  #   critic        storyboard self-critique           (planner/lesson_planner.py)
  #   cue_refill    re-ask for a missing cue list      (planner/lesson_planner.py)
  #   director      scene code per section             (generator/scene_generator.py)
  #   error_fix     fix a scene that failed to render  (validator/retry.py)
  #   visual_fix    fix defects found in rendered frames (validator/retry.py)
  #   layout_check  vision verdict on rendered frames  (validator/layout_checker.py)
  # Tiers worth trialling, one role at a time, compared with the usage ledger
  # (llm.usage_summary()) over about 10 topics: planner on opus; researcher,
  # critic, director, error_fix and visual_fix on sonnet; cue_refill and
  # layout_check on haiku.
  models: {}
  #   planner: "opus"
  #   researcher: "sonnet"
  #   critic: "sonnet"
  #   director: "sonnet"
  #   error_fix: "sonnet"
  #   visual_fix: "sonnet"
  #   cue_refill: "haiku"
  #   layout_check: "haiku"
  gemini_model: "gemini-2.5-flash"
  anthropic_model: "claude-sonnet-5-5"
  max_tokens: 16000       # Only used by Anthropic provider
  ollama_model: "llama3.1"
  ollama_base_url: "http://localhost:11434"
  ollama_num_ctx: 32768   # context window sent to Ollama (its default truncates the Director prompt)

output:
  scenes_dir: manimgen/output/scenes
  videos_dir: manimgen/output/videos
  logs_dir: manimgen/output/logs
  audio_dir: manimgen/output/audio
  muxed_dir: manimgen/output/muxed
  exports_dir: manimgen/output/videos/exports
  plan_cache: manimgen/output/plan.json

rendering:
  quality: hd           # l = 480p | m = 720p | hd = 1080p | uhd = 4K (l is a fast draft)
  resolution: "1920x1080"
  fps: 60
  max_retries: 3        # LLM retry calls per scene (increase for production)
  # Render time budgets in seconds; the whole manimgl process tree is killed on
  # expiry. Unmeasured on the target PC: run `python scripts/render_smoke.py`
  # there and set these from the 1080p time. Env override:
  # MANIMGEN_RENDER_TIMEOUT_2D / _3D / _FALLBACK.
  render_timeout_2d: 240
  render_timeout_3d: 360
  render_timeout_fallback: 180

# Codeguard Phase 3 — kwarg enforcement
# When MANIMGEN_KWARG_ENFORCE=1, provably-invalid constructor kwargs are stripped
# before render (Phase 2 shadow-mode data confirms safety). Default: off (shadow only).
# Enable after verifying zero false positives in a shadow log run.
#   export MANIMGEN_KWARG_ENFORCE=1
#
# Freeze-frame detection threshold (seconds). Cues with animation finishing this
# many seconds before narration ends are hard-blocked and routed to retry.
# Lower = stricter. Default: 2.5s (env: MANIMGEN_FREEZE_BLOCK_THRESHOLD).
#   export MANIMGEN_FREEZE_BLOCK_THRESHOLD=2.0

tts:
  # edge-tts is the ONLY implemented engine. renderer/tts.py does not read this
  # key at all — it calls edge-tts directly. ElevenLabs / OpenAI backends are a
  # possible future addition (UNIMPLEMENTED); until one lands, changing this
  # value has no effect on which engine runs.
  engine: edge-tts
  voice: en-US-AndrewMultilingualNeural
  enabled: true
  speed: "+5%"
  # Optional proxy URL for edge-tts (HTTPS_PROXY is used when this is unset).
  # proxy: "http://proxy.example.com:8080"
