name: CI

# Hardened gate: every PR to main and every push to main must pass ALL jobs.
# Designed so a regression cannot land silently — the failures this repo used
# to hide behind a curated `--ignore` pytest command now fail the build.

on:
  pull_request:
    branches: [main]
  push:
    # claude/** lets a working branch be tested without opening a PR (a branch
    # with an open PR runs twice, once per event; the concurrency group below
    # only de-duplicates runs of the same ref).
    branches: [main, "claude/**"]
  # Manual run from the Actions tab or the API (needs no local tooling, so it
  # works from a machine where you have no admin rights).
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: manimgen

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff==0.15.13
      - name: ruff check (manimgen/ source — strict, ruff.toml allowlist)
        run: ruff check manimgen/
      - name: ruff format --check (manimgen/ source)
        run: ruff format --check manimgen/

  test:
    name: Full test suite (no ignores, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every interpreter's result instead of cancelling the rest on
      # the first failure: a 3.11-only break is the signal this matrix exists for.
      fail-fast: false
      matrix:
        # 3.11 is the oldest supported interpreter (and what the Windows job
        # pins); 3.13 is the development interpreter.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System libs — manim native build deps (pangocairo) + GL + FFmpeg (ffprobe)
        # manimgl pulls OpenGL/GLU; tests don't render but DO import manimlib.
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libpango1.0-dev
          libcairo2-dev
          libgl1 libglu1-mesa libegl1
          ffmpeg
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Run the ENTIRE suite — zero --ignore flags
        # This is the core of the hardening: the previously-hidden
        # failures (test_caps_overshooting_llm, the stale e2e test) are
        # fixed, so a green run here is an honest green.
        # --strict-markers ensures markers can't silently rot.
        # No --maxfail: report a change's FULL blast radius, not just the
        # first failure. --strict-markers is also set in pyproject.toml so a
        # bare local `pytest` matches this invocation (local == CI).
        run: python3 -m pytest tests/ -q --strict-markers

  smoke:
    name: Mocked-LLM pipeline smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: System libs — manim native build deps (pangocairo) + GL + FFmpeg (ffprobe)
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libpango1.0-dev
          libcairo2-dev
          libgl1 libglu1-mesa libegl1
          ffmpeg
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Pipeline contract + Director smoke (mocked LLM, zero API cost)
        # The real behavioral signal here is test_pipeline_contracts (A/V
        # sync invariants) + test_director (planner->Director->scene-gen
        # wiring) + test_pipeline_e2e (cli.py orchestration at the chat() +
        # subprocess.run seams). ALL LLM/subprocess/layout-checker calls are
        # mocked — zero API key, zero render, zero network. A wiring
        # regression in any of these fails here without any API cost.
        run: python3 -m pytest tests/test_pipeline_contracts.py tests/test_pipeline_e2e.py tests/test_director.py -q --strict-markers

  windows:
    name: Full test suite (Windows, Python 3.11)
    # The primary user runs manimgen on a Windows 11 PC without admin rights,
    # so Windows-only breakage (cp1252 default text encoding, backslash paths,
    # files that cannot be deleted while open, reserved filename characters)
    # must fail CI rather than surface on that machine. PYTHONUTF8 is
    # deliberately NOT set here: the job has to run under Windows' real
    # default encoding to catch a missing encoding="utf-8".
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: FFmpeg (ffprobe)
        # Chocolatey is preinstalled on the hosted runner; its shims land in
        # C:\ProgramData\chocolatey\bin, which is already on PATH.
        run: choco install ffmpeg -y --no-progress
      - name: Install dependencies
        # No apt equivalent is needed: on Python 3.11 every native manimgl
        # dependency (manimpango, skia-pathops, moderngl, mapbox-earcut) ships
        # a prebuilt win_amd64 wheel, so nothing compiles. If a future manimgl
        # or dependency bump drops one of those wheels, this step fails with a
        # "Microsoft Visual C++ 14.0 or greater is required" build error; pin
        # the dependency to the last version with a Windows wheel rather than
        # removing this job.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Run the ENTIRE suite on Windows
        run: python -m pytest tests/ -q --strict-markers

  windows-render:
    name: Windows real render (software OpenGL, exploratory)
    # EXPLORATORY. Nobody has rendered a manimgen video on Windows yet, and a
    # hosted runner has no GPU, so this job tries a real render on software
    # OpenGL. continue-on-error keeps a failure here from turning the whole
    # workflow red while we learn what works; remove it once this is proven.
    #
    # Software OpenGL options considered for a GPU-less Windows runner:
    #   1. Mesa llvmpipe via pal1000/mesa-dist-win (CHOSEN). Its release .7z
    #      holds x64\opengl32.dll (+ libgallium_wgl.dll, libglapi.dll on Mesa
    #      24+). A Mesa opengl32.dll placed NEXT TO python.exe is found before
    #      C:\Windows\System32\opengl32.dll, so moderngl/glcontext (WGL) and
    #      manimgl pick up llvmpipe with no admin rights and no install. This is
    #      also the realistic no-admin recipe for the library PC if its GL
    #      driver turns out to be unusable.
    #   2. MSYS2 / choco mesa: gives mingw-built Mesa for MSYS2 programs, not a
    #      drop-in opengl32.dll for a python.org-style CPython; more moving
    #      parts, rejected.
    #   3. Microsoft's "OpenGL Compatibility Pack" / D3D12 mapping layer: only
    #      OpenGL 3.3 via a Store package, needs a GPU/WARP device and the
    #      Store; rejected.
    # UNPROVEN: that the hosted runner lets the GDI pixel-format path of
    # llvmpipe create a 3.3+ core context for moderngl, that the asset name
    # pattern below still matches the latest mesa-dist-win release, and that
    # the DLL set copied is sufficient. The render_smoke OpenGL check prints
    # the exact reason if any of that is wrong.
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true
    env:
      # get_render_env() forwards only an allowlist of variables to manimgl;
      # these Mesa variables must be named here to reach the render child.
      MANIMGEN_RENDER_ENV_EXTRA: GALLIUM_DRIVER,MESA_GL_VERSION_OVERRIDE,MESA_GLSL_VERSION_OVERRIDE
      GALLIUM_DRIVER: llvmpipe
      MESA_GL_VERSION_OVERRIDE: "4.5"
      MESA_GLSL_VERSION_OVERRIDE: "450"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: FFmpeg (ffmpeg + ffprobe)
        run: choco install ffmpeg -y --no-progress
      - name: Install dependencies
        # setuptools<81 (pkg_resources for manimgl) is pinned in requirements.txt.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Mesa llvmpipe opengl32.dll next to python.exe (software OpenGL)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $work = Join-Path $env:RUNNER_TEMP "mesa"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          gh release download --repo pal1000/mesa-dist-win --pattern "mesa3d-*-release-msvc.7z" --dir $work
          if ($LASTEXITCODE -ne 0) { throw "could not download the mesa-dist-win release" }
          $archive = Get-ChildItem -Path $work -Filter "mesa3d-*-release-msvc.7z" | Select-Object -First 1
          if (-not $archive) { throw "no mesa3d-*-release-msvc.7z asset found" }
          Write-Host "Using $($archive.Name)"
          $extract = Join-Path $work "x"
          7z x $archive.FullName "-o$extract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z extraction failed" }
          $pyDir = $env:pythonLocation
          foreach ($name in "opengl32.dll", "libgallium_wgl.dll", "libglapi.dll") {
            $src = Join-Path $extract "x64\$name"
            if (Test-Path $src) {
              Copy-Item $src -Destination $pyDir -Force
              Write-Host "copied $name -> $pyDir"
            } else {
              Write-Host "note: $name not in this Mesa release"
            }
          }
          if (-not (Test-Path (Join-Path $pyDir "opengl32.dll"))) { throw "opengl32.dll was not installed" }
      - name: Render smoke test (480p only, software OpenGL is slow)
        # --out keeps the rendered mp4, render.log files and smoke_report.txt in
        # manimgen/smoke_out so the next step can upload them.
        run: python scripts/render_smoke.py --quick --out smoke_out
      - name: Upload render and smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-render-smoke
          path: manimgen/smoke_out/
          if-no-files-found: warn
