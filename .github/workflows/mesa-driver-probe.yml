name: Mesa driver probe (experiment)

# One-off experiment, safe to delete once it has answered its question:
# can Mesa on Windows run OpenGL through DirectX 12 (d3d12) or Vulkan (zink)
# instead of on the CPU (llvmpipe)? If yes, a PC with a working GPU but a broken
# OpenGL driver could use the GPU without any change to ManimGL.
#
# It runs only when this file changes, never on ordinary pushes, and the job is
# continue-on-error so it cannot turn a pull request red. GitHub's Windows
# runners have no GPU, so this answers "does the driver load and create an
# OpenGL 3.3+ context", not "how fast is it on an Intel UHD 770".

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/mesa-driver-probe.yml"]

jobs:
  probe:
    name: Mesa drivers on Windows (llvmpipe, d3d12, zink)
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install moderngl
        run: python -m pip install moderngl
      - name: Download and unpack the newest Mesa build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $work = Join-Path $env:RUNNER_TEMP "mesa"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          gh release download --repo pal1000/mesa-dist-win --pattern "mesa3d-*-release-msvc.7z" --dir $work
          $archive = Get-ChildItem -Path $work -Filter "mesa3d-*-release-msvc.7z" | Select-Object -First 1
          Write-Host "Release asset: $($archive.Name)"
          7z x $archive.FullName "-o$work\x" -y | Out-Null
          Write-Host "--- x64 files"
          Get-ChildItem "$work\x\x64" | Select-Object Name, @{n="MB";e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize | Out-String | Write-Host
          # Which drivers are compiled into the Mesa DLLs? (Strings are enough to tell.)
          foreach ($dll in "libgallium_wgl.dll", "opengl32.dll") {
            $path = "$work\x\x64\$dll"
            if (Test-Path $path) {
              $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($path))
              foreach ($name in "llvmpipe", "d3d12", "zink", "softpipe") {
                Write-Host ("{0,-22} contains '{1}': {2}" -f $dll, $name, $text.Contains($name))
              }
            }
          }
          "MESA_DIR=$work\x\x64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Try each driver (copy the DLLs next to python.exe, create a context)
        shell: pwsh
        run: |
          $pyDir = Split-Path (python -c "import sys; print(sys.executable)")
          foreach ($name in "opengl32.dll", "libgallium_wgl.dll", "libglapi.dll") {
            $src = Join-Path $env:MESA_DIR $name
            if (Test-Path $src) { Copy-Item $src $pyDir -Force; Write-Host "copied $name" }
          }
          $probe = @'
          import time, moderngl
          t = time.perf_counter()
          ctx = moderngl.create_standalone_context()
          info = ctx.info
          print("RESULT renderer=%s | version=%s | context in %.2fs" % (info["GL_RENDERER"], info["GL_VERSION"], time.perf_counter() - t))
          fbo = ctx.simple_framebuffer((1920, 1080))
          fbo.use()
          t = time.perf_counter()
          for _ in range(120):
              fbo.clear(0.1, 0.2, 0.3, 1.0)
          ctx.finish()
          print("RESULT 120 full-HD clears in %.2fs" % (time.perf_counter() - t))
          '@
          Set-Content -Path probe.py -Value $probe -Encoding utf8
          foreach ($driver in "llvmpipe", "d3d12", "zink") {
            Write-Host "=============== GALLIUM_DRIVER=$driver"
            $env:GALLIUM_DRIVER = $driver
            $env:MESA_GL_VERSION_OVERRIDE = "4.5"
            $env:MESA_GLSL_VERSION_OVERRIDE = "450"
            python probe.py 2>&1 | ForEach-Object { Write-Host $_ }
            Write-Host "exit code: $LASTEXITCODE"
          }
          Write-Host "=============== no override (what Windows picks with the Mesa DLL present)"
          Remove-Item Env:GALLIUM_DRIVER -ErrorAction SilentlyContinue
          python probe.py 2>&1 | ForEach-Object { Write-Host $_ }
          exit 0
