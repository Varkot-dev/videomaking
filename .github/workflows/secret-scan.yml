name: Secret scan

# This repository is public, so a committed credential is exposed permanently
# even if a later commit deletes it — the blob stays reachable by SHA. Catching
# one before it lands is the only cheap moment.
#
# Deliberately separate from ci.yml: that workflow gates code quality and its
# jobs run inside manimgen/. This one scans the whole tree from the repo root,
# and keeping it independent means a lint failure never masks a leaked key.

on:
  pull_request:
  push:
    branches: ["**"]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Credential patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for credential patterns
        # Patterns verified against a planted key before being committed — an
        # unverified scanner reports "no findings" identically whether it works
        # or silently matches nothing.
        #
        # This file is excluded from its own scan so the patterns below are not
        # themselves reported.
        run: |
          if git grep -nIE \
            'AIza[0-9A-Za-z_-]{35}|sk-ant-[0-9A-Za-z_-]{20,}|sk-proj-[0-9A-Za-z_-]{20,}|ghp_[0-9A-Za-z]{36}|AKIA[0-9A-Z]{16}|xoxb-[0-9A-Za-z-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' \
            -- . ':(exclude).github/workflows/secret-scan.yml'; then
            echo "::error::Possible credential found in a tracked file"
            exit 1
          fi
          echo "No credential patterns found in tracked files."

      - name: Verify .env is not tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked — it must remain gitignored"
            exit 1
          fi
          echo ".env is not tracked."

      - name: Verify no third-party media was reintroduced
        # manimgen/manimgen/reference_frames/ held 20 frames captured from
        # 3Blue1Brown videos, removed because the rendered videos are
        # copyrighted even though Manim itself is MIT. See manimgen/NOTICE. That
        # directory is meant to hold self-rendered frames only, so this checks
        # nothing large reappears there by accident.
        run: |
          frames=manimgen/manimgen/reference_frames
          if [ -d "$frames" ]; then
            size=$(du -sk "$frames" | cut -f1)
            if [ "$size" -gt 2048 ]; then
              echo "::error::$frames exceeds 2MB (${size}KB) — see manimgen/NOTICE before adding media"
              exit 1
            fi
          fi
          echo "reference_frames is within limits."
